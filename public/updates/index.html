<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Updates</title>
    <style>
      body {
        margin: 8px;
        min-width: 320px;
        line-height: 1.5;
      }

      a {
        color: inherit;
      }

      .stack {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
    </style>
    <link rel="stylesheet" href="/site.css" />
  </head>
  <body>
    <p><a href="/">Back</a></p>
    <h2>Updates</h2>
    <div id="updates">Checking your session...</div>
    <script>
      function formatDate(value) {
        const parsed = new Date(`${value.trim()}T00:00:00`)
        return Number.isNaN(parsed.getTime())
          ? value
          : new Intl.DateTimeFormat('en-US', {
              month: 'short',
              day: 'numeric',
              year: 'numeric',
            }).format(parsed)
      }

      fetch('/api/session', { credentials: 'include' })
        .then((response) => {
          if (!response.ok) {
            throw new Error(`Failed to check session: ${response.status}`)
          }
          return response.json()
        })
        .then((session) => {
          if (!session.logged_in) {
            document.getElementById('updates').innerHTML =
              '<p>You need to log in before you can view updates.</p><p><a href="/login/">Go to login</a></p>'
            return null
          }

          return fetch('/api/updates', { credentials: 'include' })
        })
        .then((response) => {
          if (!response) {
            return null
          }

          if (response.status === 401) {
            document.getElementById('updates').innerHTML =
              '<p>You need to log in before you can view updates.</p><p><a href="/login/">Go to login</a></p>'
            return null
          }

          if (!response.ok) {
            throw new Error(`Failed to load updates: ${response.status}`)
          }

          return response.json()
        })
        .then((updates) => {
          if (!updates) {
            return
          }

          const root = document.getElementById('updates')
          root.innerHTML = ''

          if (updates.length === 0) {
            root.textContent = 'No updates found yet.'
            return
          }

          const list = document.createElement('div')
          list.className = 'stack'

          updates.forEach((update) => {
            const item = document.createElement('div')
            item.textContent = `${formatDate(update.date)}: ${update.info}`
            list.appendChild(item)
          })

          root.appendChild(list)
        })
        .catch((error) => {
          document.getElementById('updates').textContent = error.message
        })
    </script>
  </body>
</html>
