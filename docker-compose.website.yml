services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - backend/.env
    volumes:
      - ./public:/app/public:ro
    restart: unless-stopped

  website:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: neocities-website
    ports:
      - "9500:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped
